<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#020617"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="./icons/icon-192.svg"/>
  <title>TradeFlow Authentication</title>
  <link rel="stylesheet" href="./css/tailwind.css">
  <script src="./js/client-error-tracker.js" defer></script>
  <style>
    body{
      background:radial-gradient(circle at top left,#1e293b,#020617 60%);
      padding-top:env(safe-area-inset-top);
      padding-right:env(safe-area-inset-right);
      padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
    }
    .glass{backdrop-filter:blur(18px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);}
    .input{width:100%;padding:14px 16px;border-radius:14px;background:#0f172a;color:white;border:1px solid #334155;outline:none;}
    .input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2);}
    .btn{width:100%;padding:14px;border-radius:14px;font-weight:800;}
    .btn-primary{background:linear-gradient(to right,#2563eb,#7c3aed);color:white;}
    .tab-active{background:white;color:black;}
    @media (max-width: 640px) {
      body{align-items:flex-start;padding:16px;padding-top:max(16px,env(safe-area-inset-top));}
      .glass{border-radius:22px;padding:22px;}
      h2{font-size:2rem!important;line-height:1.1!important;}
      .input,.btn{min-height:48px;font-size:16px;}
    }
  </style>
</head>

<body class="min-h-screen text-white flex items-center justify-center p-5">
  <div class="w-full max-w-6xl grid lg:grid-cols-2 gap-10 items-center">
    <div class="hidden lg:block">
      <h1 class="text-6xl font-black">TradeFlow</h1>
      <p class="mt-6 text-slate-300 text-lg leading-8">
        Advanced Export / Import SaaS platform for supplier discovery,
        AI lead generation, outreach automation, CRM pipelines and analytics.
      </p>
    </div>

    <div class="glass rounded-[32px] p-8 lg:p-10 shadow-2xl">
      <div class="text-center mb-8">
        <h2 class="text-4xl font-black">Welcome Back</h2>
        <p class="text-slate-300 mt-3">Login or create your TradeFlow workspace</p>
      </div>

      <div class="bg-slate-900 p-1 rounded-2xl flex mb-8">
        <button id="loginTab" class="flex-1 py-3 rounded-2xl font-bold tab-active">Login</button>
        <button id="signupTab" class="flex-1 py-3 rounded-2xl font-bold text-white">Create Account</button>
      </div>

      <form id="loginForm" class="space-y-5">
        <input id="loginEmail" type="email" required placeholder="Email" class="input"/>
        <input id="loginPassword" type="password" required placeholder="Password" class="input"/>
        <button type="submit" class="btn btn-primary">Login to TradeFlow</button>
        <button id="forgotPasswordLink" type="button" class="w-full text-sm font-bold text-blue-300 hover:text-blue-200">Forgot password?</button>
      </form>

      <form id="signupForm" class="space-y-5 hidden">
        <input id="signupName" type="text" required placeholder="Full name" class="input"/>
        <input id="signupCompany" type="text" required placeholder="Company name" class="input"/>
        <input id="signupEmail" type="email" required placeholder="Email" class="input"/>
        <input id="signupPassword" type="password" required placeholder="Password" class="input"/>
        <button type="submit" class="btn btn-primary">Create TradeFlow Account</button>
      </form>

      <form id="forgotForm" class="space-y-5 hidden">
        <input id="forgotEmail" type="email" required placeholder="Business email" class="input"/>
        <button type="submit" class="btn btn-primary">Send Password Reset Link</button>
        <button id="backToLoginFromForgot" type="button" class="w-full text-sm font-bold text-slate-300 hover:text-white">Back to login</button>
      </form>

      <form id="resetForm" class="space-y-5 hidden">
        <input id="resetEmail" type="email" required placeholder="Email" class="input"/>
        <input id="resetToken" type="hidden"/>
        <input id="resetPassword" type="password" required minlength="8" placeholder="New password" class="input"/>
        <button type="submit" class="btn btn-primary">Reset Password</button>
        <button id="backToLoginFromReset" type="button" class="w-full text-sm font-bold text-slate-300 hover:text-white">Back to login</button>
      </form>

      <div id="messageBox" class="hidden mt-6 p-4 rounded-2xl text-center font-bold"></div>
    </div>
  </div>

<script>
const RENDER_BACKEND_URL = "https://trade-flow-lc1k.onrender.com";

function isLocalHost(hostname) {
  return hostname === "localhost" || hostname === "127.0.0.1" || hostname === "::1";
}

const API_BASE =
  window.TRADEFLOW_API_BASE ||
  window.TRADEFLOW_API_BASE_URL ||
  (isLocalHost(window.location.hostname)
    ? window.location.origin
    : RENDER_BACKEND_URL);

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const forgotForm = document.getElementById("forgotForm");
const resetForm = document.getElementById("resetForm");
const forgotPasswordLink = document.getElementById("forgotPasswordLink");
const backToLoginFromForgot = document.getElementById("backToLoginFromForgot");
const backToLoginFromReset = document.getElementById("backToLoginFromReset");
const messageBox = document.getElementById("messageBox");
const blockedSignupDomains = new Set([
  "gmail.com",
  "googlemail.com",
  "yahoo.com",
  "ymail.com",
  "hotmail.com",
  "outlook.com",
  "live.com",
  "msn.com",
  "icloud.com",
  "me.com",
  "mac.com",
  "aol.com",
  "proton.me",
  "protonmail.com",
  "pm.me",
  "zoho.com",
  "gmx.com",
  "mail.com",
  "yandex.com",
  "hey.com",
  "fastmail.com",
  "tutanota.com",
  "mailinator.com",
  "tempmail.com",
  "temp-mail.org",
  "10minutemail.com",
  "guerrillamail.com",
  "throwawaymail.com",
  "trashmail.com",
  "example.com",
  "test.com",
  "localhost"
]);

function showMessage(message,type="error"){
  messageBox.classList.remove("hidden");
  messageBox.className = type === "success"
    ? "mt-6 p-4 rounded-2xl text-center font-bold bg-green-500/20 text-green-300"
    : "mt-6 p-4 rounded-2xl text-center font-bold bg-red-500/20 text-red-300";
  messageBox.innerText = message;
}

function hideMessage() {
  messageBox.classList.add("hidden");
}

function showAuthView(view) {
  hideMessage();
  loginForm.classList.toggle("hidden", view !== "login");
  signupForm.classList.toggle("hidden", view !== "signup");
  forgotForm.classList.toggle("hidden", view !== "forgot");
  resetForm.classList.toggle("hidden", view !== "reset");
  loginTab.classList.toggle("tab-active", view === "login");
  signupTab.classList.toggle("tab-active", view === "signup");
  signupTab.classList.toggle("text-white", view !== "signup");
  loginTab.classList.toggle("text-white", view !== "login");
}

function validateCorporateEmail(email) {
  const normalized = String(email || "").trim().toLowerCase();
  const parts = normalized.split("@");
  const domain = parts.length === 2 ? parts[1] : "";

  if (
    parts.length !== 2 ||
    !parts[0] ||
    !/^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(parts[0]) ||
    !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(domain) ||
    domain.includes("..") ||
    blockedSignupDomains.has(domain)
  ) {
    throw new Error("Use a valid company email address to create a TradeFlow account.");
  }

  return normalized;
}

function saveSession(data){
  const rawData = data.data || {};
  const rawUser = data.user || rawData.user || rawData || data;
  const tokenCandidates = [
    ["data.token", data.token],
    ["data.accessToken", data.accessToken],
    ["data.jwt", data.jwt],
    ["data.data.token", rawData.token],
    ["data.data.accessToken", rawData.accessToken],
    ["data.data.jwt", rawData.jwt],
    ["data.user.token", rawUser.token],
    ["data.user.accessToken", rawUser.accessToken]
  ];
  const tokenMatch = tokenCandidates.find((candidate) => Boolean(candidate[1]));
  const token = tokenMatch?.[1] || "";

  console.log("[AUTH DEBUG] login response keys", Object.keys(data || {}).join(","));
  console.log("[AUTH DEBUG] login response token source", tokenMatch?.[0] || "missing");

  if (!token) {
    throw new Error("Authentication token missing from login response");
  }

  const subscriptionPlan =
    rawUser.subscriptionPlan ||
    rawUser.plan ||
    rawData.subscriptionPlan ||
    data.subscriptionPlan ||
    "Starter";

  const user = {
    ...rawUser,
    token,
    accessToken: token,
    role: rawUser.role || "Founder",
    plan: subscriptionPlan,
    subscriptionPlan,
    subscription: rawUser.subscription || subscriptionPlan,
    onboardingCompleted:
      rawUser.onboardingCompleted === true ||
      data.onboardingCompleted === true,
    isLoggedIn: true
  };

  localStorage.setItem("tradeflowUser", JSON.stringify(user));
  localStorage.setItem("user", JSON.stringify(user));
  localStorage.setItem("currentUser", JSON.stringify(user));
  localStorage.setItem("tradeflowAccessToken", token);
  localStorage.setItem("tradeflowToken", token);
  localStorage.setItem("token", token);
  localStorage.setItem("authToken", token);
  localStorage.setItem("jwt", token);
  localStorage.setItem("isLoggedIn", "true");
  localStorage.setItem("tradeflowLoggedIn", "true");
  localStorage.setItem("tradeflowSubscriptionPlan", subscriptionPlan);

  console.log("[AUTH DEBUG] token after login", token ? "present" : "missing");

  if (user.onboardingCompleted === true) {
    localStorage.setItem("tradeflowOnboardingDone", "true");
  }

  return user;
}

function getSafeNextPath() {
  const candidate = new URLSearchParams(window.location.search).get("next");
  if (!candidate) return "";

  const approvedPaths = new Set([
    "/app",
    "/master-admin.html",
    "/onboarding"
  ]);

  try {
    const parsed = new URL(candidate, window.location.origin);
    if (
      parsed.origin !== window.location.origin ||
      !approvedPaths.has(parsed.pathname) ||
      parsed.search ||
      parsed.hash ||
      parsed.pathname === "/login"
    ) {
      return "";
    }
    return parsed.pathname;
  } catch {
    return "";
  }
}

async function safeJson(res) {
  const contentType = res.headers.get("content-type") || "";

  if (contentType.includes("application/json") || contentType.includes("+json")) {
    return await res.json();
  }

  const text = await res.text();
  if (!text) return {};
  console.error("[API JSON ERROR]", {
    status: res.status,
    url: res.url,
    contentType,
    bodyPreview: text.slice(0, 300)
  });
  throw new Error(`Backend returned non-JSON response from ${res.url}`);
}

loginTab.onclick = () => {
  showAuthView("login");
};

signupTab.onclick = () => {
  showAuthView("signup");
};

forgotPasswordLink.onclick = () => {
  document.getElementById("forgotEmail").value = document.getElementById("loginEmail").value.trim();
  showAuthView("forgot");
};

backToLoginFromForgot.onclick = () => showAuthView("login");
backToLoginFromReset.onclick = () => showAuthView("login");

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  try {
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      credentials:"include",
      body:JSON.stringify({
        email:document.getElementById("loginEmail").value.trim(),
        password:document.getElementById("loginPassword").value
      })
    });

    const data = await safeJson(res);

    if(!res.ok || data.success === false){
      throw new Error(data.message || "Login failed");
    }

    const user = saveSession(data);
    const onboardingDone =
      user.onboardingCompleted === true ||
      localStorage.getItem("tradeflowOnboardingDone") === "true";

    const destination =
      getSafeNextPath() ||
      (onboardingDone ? "/app" : "/onboarding");

    showMessage(
      destination === "/app"
        ? "Login successful. Opening dashboard..."
        : "Login successful. Opening onboarding guide...",
      "success"
    );

    setTimeout(() => {
      window.location.href = destination;
    }, 800);

  } catch(err) {
    showMessage(err.message || "Server request failed");
  }
});

signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  try {
    const signupEmail = validateCorporateEmail(document.getElementById("signupEmail").value);

    const res = await fetch(`${API_BASE}/api/auth/signup`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      credentials:"include",
      body:JSON.stringify({
        name:document.getElementById("signupName").value.trim(),
        companyName:document.getElementById("signupCompany").value.trim(),
        email:signupEmail,
        password:document.getElementById("signupPassword").value,
        role:"master_admin"
      })
    });

    const data = await safeJson(res);

    if(!res.ok || data.success === false){
      throw new Error(data.message || "Signup failed");
    }

    saveSession(data);
    showMessage("Account created. Opening onboarding guide...","success");

    setTimeout(() => {
      window.location.href = "/onboarding";
    }, 800);

  } catch(err) {
    showMessage(err.message || "Server request failed");
  }
});

forgotForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  try {
    const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      credentials:"include",
      body:JSON.stringify({
        email:document.getElementById("forgotEmail").value.trim()
      })
    });

    const data = await safeJson(res);

    if(!res.ok || data.success === false){
      throw new Error(data.message || "Password reset request failed");
    }

    showMessage(data.resetUrl ? `Reset link generated: ${data.resetUrl}` : data.message, "success");
  } catch(err) {
    showMessage(err.message || "Server request failed");
  }
});

resetForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  try {
    const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      credentials:"include",
      body:JSON.stringify({
        email:document.getElementById("resetEmail").value.trim(),
        resetToken:document.getElementById("resetToken").value,
        password:document.getElementById("resetPassword").value
      })
    });

    const data = await safeJson(res);

    if(!res.ok || data.success === false){
      throw new Error(data.message || "Password reset failed");
    }

    showAuthView("login");
    showMessage(data.message || "Password reset successful. Please login.", "success");
  } catch(err) {
    showMessage(err.message || "Server request failed");
  }
});

const resetParams = new URLSearchParams(window.location.search);
if (resetParams.get("resetToken")) {
  document.getElementById("resetEmail").value = resetParams.get("email") || "";
  document.getElementById("resetToken").value = resetParams.get("resetToken") || "";
  showAuthView("reset");
}
</script>

</body>
</html>
