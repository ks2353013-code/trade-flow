# Review-only disabled-first production Blueprint.
# Expected recurring Render cost if applied: $32/month ($7 backend + $25 private ClamAV).
# Do not synchronize or deploy without explicit owner approval.
services:
  - type: web
    name: tradeflow-verification-backend-production
    branch: business-verification-production-readiness
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADEFLOW_ENVIRONMENT
        value: production
      - key: BUSINESS_VERIFICATION_ENABLED
        value: false
      - key: BUSINESS_VERIFICATION_PRODUCTION_MONGO_CONFIRMED
        sync: false
      - key: BUSINESS_VERIFICATION_PRODUCTION_MONGO_USER_CONFIRMED
        sync: false
      - key: BUSINESS_VERIFICATION_PRODUCTION_STORAGE_CONFIRMED
        sync: false
      - key: BUSINESS_VERIFICATION_STORAGE_DRIVER
        value: s3
      - key: BUSINESS_VERIFICATION_S3_BUCKET
        value: tradeflow-verification-production
      - key: BUSINESS_VERIFICATION_S3_PUBLIC_ACCESS_BLOCKED
        value: true
      - key: BUSINESS_VERIFICATION_SCANNER_DRIVER
        value: clamav
      - key: BUSINESS_VERIFICATION_CLAMAV_HOST
        value: tradeflow-verification-clamav-production
      - key: BUSINESS_VERIFICATION_CLAMAV_PORT
        value: 3310
      - key: BUSINESS_VERIFICATION_SCANNER_TIMEOUT_MS
        value: 10000
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: 4000
      - key: EMAIL_MODE
        value: dry-run
      - key: ENABLE_EMAIL_AUTOMATION
        value: false
      - key: ENABLE_SCHEDULERS
        value: false
      - key: ENABLE_WHATSAPP_AUTOMATION
        value: false
      - key: ENABLE_CALL_AUTOMATION
        value: false
      - key: ENABLE_CALLS
        value: false
      - key: ENABLE_AUTONOMOUS_EXECUTION
        value: false
      - key: ENABLE_AI_AUTONOMOUS_HTTP_SCHEDULER
        value: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BUSINESS_VERIFICATION_ENCRYPTION_KEY
        sync: false
      - key: BUSINESS_VERIFICATION_HASH_KEY
        sync: false
      - key: BUSINESS_VERIFICATION_KEY_VERSION
        sync: false
      - key: BUSINESS_VERIFICATION_S3_ENDPOINT
        sync: false
      - key: BUSINESS_VERIFICATION_S3_REGION
        sync: false
      - key: BUSINESS_VERIFICATION_S3_ACCESS_KEY_ID
        sync: false
      - key: BUSINESS_VERIFICATION_S3_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: pserv
    name: tradeflow-verification-clamav-production
    branch: business-verification-production-readiness
    env: docker
    plan: standard
    dockerfilePath: ./deploy/production/clamav/Dockerfile
    dockerContext: ./deploy/production/clamav
    autoDeploy: false
